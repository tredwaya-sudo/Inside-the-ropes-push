services:
  - type: web
    name: inside-the-ropes-push
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_PATH
        value: "./data/push.sqlite"
      - key: APNS_PRODUCTION
        value: "true"
      - key: APNS_TEAM_ID
        value: "K95LALRF9A"
      - key: APNS_BUNDLE_ID
        value: "com.insidetheropes.InsideTheRopes"
